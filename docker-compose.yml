services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cdms
      POSTGRES_USER: cdms
      POSTGRES_PASSWORD: cdms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdms -d cdms"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  inventory:
    build: ./inventory_mock
    ports:
      - "8080:8080"
    environment:
      CDMS_BASE_URL: http://cdms:8000
      WEBHOOK_CALLBACK_ENABLED: "true"
      WEBHOOK_SECRET: ""
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  cdms:
    build: ./cdms
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://cdms:cdms@postgres:5432/cdms
      EMULATOR_BASE_URL: http://inventory:8080
      POLL_INTERVAL_SECONDS: "30"
      WEBHOOK_SECRET: ""
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
